<script>
// --- WebMIDI / WebSerial helper for sending binary resynthesis frames ---
// This small helper demonstrates sending a test frame (2 voices) to the
// FPGA over the existing WebSerial connection. The frame format matches the
// frame_receiver: [0xF0][COUNT][ entries... ][COMMIT 0xF1]
// Entry = PHASE_INC (4 bytes BE) + AMP (2 bytes BE) + FLAGS (1 byte)

async function sendResynthTestFrame() {
  if (!port || !writer) {
    setStatus('no port connected', false);
    return;
  }

  // helper: compute phase_inc from frequency (Hz)
  function freqToInc(freq) {
    // master clock = 12e6
    return Math.round(freq * Math.pow(2,32) / 12e6) >>> 0;
  }

  // Example: two partial voices
  const entries = [
    { freq: 220.0, amp: 40000 },
    { freq: 440.0, amp: 30000 }
  ];

  // build buffer
  const count = entries.length;
  // start byte + count + entries(7 bytes each) + commit
  const buf = new Uint8Array(1 + 1 + count * 7 + 1);
  let idx = 0;
  buf[idx++] = 0xF0;
  buf[idx++] = count & 0xff;
  for (let e of entries) {
    const inc = freqToInc(e.freq);
    // PHASE_INC 4 bytes BE
    buf[idx++] = (inc >>> 24) & 0xff;
    buf[idx++] = (inc >>> 16) & 0xff;
    buf[idx++] = (inc >>> 8) & 0xff;
    buf[idx++] = (inc >>> 0) & 0xff;
    // AMP 2 bytes BE (clamp)
    const amp = Math.max(0, Math.min(65535, e.amp)) & 0xffff;
    buf[idx++] = (amp >>> 8) & 0xff;
    buf[idx++] = (amp >>> 0) & 0xff;
    // FLAGS (unused)
    buf[idx++] = 0x00;
  }
  // commit
  buf[idx++] = 0xF1;

  try {
    await writer.write(buf);
    setStatus('sent resynth test frame', true);
  } catch (err) {
    setStatus('write error: ' + err.message, false);
  }
}

// add a small button for convenience
const bar = document.querySelector('.bar');
const btn = document.createElement('button');
btn.textContent = 'Send Test Frame';
btn.addEventListener('click', sendResynthTestFrame);
bar.appendChild(btn);
</script>
